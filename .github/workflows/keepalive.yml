# Mengetuk database Supabase sekali sehari supaya proyek gratis tidak di-pause karena menganggur.
# Memakai kunci "anon" yang memang publik (sama dengan yang ada di index.html), bukan kunci rahasia.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 2 * * *'     # tiap hari 09:17 WIB
  workflow_dispatch:          # tombol "Run workflow" untuk uji manual
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyd2RoYXhtbGdmd3ZncmF5b3F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUzMTMyMDYsImV4cCI6MjExMDg4OTIwNn0.XIDVZyjVpPIbn3ZP6niwGWeSwPdN9PApEFS5atWAdCg" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyd2RoYXhtbGdmd3ZncmF5b3F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUzMTMyMDYsImV4cCI6MjExMDg4OTIwNn0.XIDVZyjVpPIbn3ZP6niwGWeSwPdN9PApEFS5atWAdCg" \
            "https://drwdhaxmlgfwvgrayoqu.supabase.co/rest/v1/plan_tiers?select=tier&limit=1")
          echo "HTTP status: $code"
          # 2xx/4xx berarti server menjawab (aktif). 5xx atau 000 berarti ada masalah.
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then exit 1; fi
